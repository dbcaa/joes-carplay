<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CarPlay – Music</title>

  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
  </style>
</head>

<body>

  <!-- UI container starts hidden; script.js will toggle the 'hidden' class -->
  <div class="carplay-container hidden">

    <!-- STATUS BAR -->
    <div class="status-bar">
      <div class="status-left">
        <div class="signal-bars">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <span class="carrier">Carrier</span>
      </div>

      <div class="status-center">
        <span class="time" id="currentTime">12:34</span>
      </div>

      <div class="status-right">
        <div class="battery">
          <span class="battery-percentage">100%</span>
          <div class="battery-icon"></div>
        </div>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main-content">

      <!-- Dock -->
      <nav class="dock-left">
        <div class="dock-inner">
          <div class="app-icon maps"><div class="icon">🗺️</div><span>Maps</span></div>
          <div class="app-icon music active"><div class="icon">🎵</div><span>Music</span></div>
          <div class="app-icon messages"><div class="icon">💬</div><span>Msgs</span></div>
          <div class="app-icon home"><div class="icon">🏠</div><span>Home</span></div>
        </div>
      </nav>

      <!-- Content center: Album hero + Player -->
      <main class="content-center">

        <!-- Big album art -->
        <section class="album-hero card">
          <img id="albumArt" src="/placeholder.svg?height=500&width=500" alt="Album Art">
        </section>

        <!-- Now playing (player) -->
        <section class="now-playing card">

          <div class="np-left">
            <div class="track-info">
              <div class="track-title-container">
                <h1 id="trackTitle" class="track-title scrolling-text">No Music Playing</h1>
              </div>
              <div class="track-artist-container">
                <p id="trackArtist" class="track-artist scrolling-text">Select a song to begin</p>
              </div>
              <div class="track-status" id="trackStatus"></div>
            </div>
          </div>

          <div class="np-center">
            <div class="playback-controls">
              <button class="control-btn previous" id="previousBtn" aria-label="Previous">
                <svg width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>

              <button class="control-btn play-pause" id="playPauseBtn" aria-label="Play/Pause">
                <svg width="32" id="playIcon" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg width="32" id="pauseIcon" style="display:none;" fill="currentColor"><path d="M6 19h4V5H6zm8-14v14h4V5h-4z"/></svg>
              </button>

              <button class="control-btn next" id="nextBtn" aria-label="Next">
                <svg width="24" height="24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
            </div>

            <div class="progress-section">
              <div class="time-display">
                <span id="currentTimeDisplay">0:00</span>
                <span id="totalTimeDisplay">0:00</span>
              </div>
              <div class="progress-bar-container" id="progressBar">
                <div class="progress-bar">
                  <div class="progress-fill" id="progressFill"></div>
                  <div class="progress-handle" id="progressHandle" aria-hidden="true"></div>
                </div>
              </div>
            </div>

            <div class="queue-controls">
              <button class="queue-control-btn shuffle-btn" id="shuffleBtn" title="Shuffle: Off">🔀</button>
              <button class="queue-control-btn repeat-btn repeat-none" id="repeatBtn" title="Repeat: Off">🔁<span class="repeat-one-indicator">1</span></button>
              <button class="queue-control-btn clear-queue-btn" id="clearQueueBtn" title="Clear Queue">🗑️</button>
            </div>
          </div>
        </section>

        <!-- Quick URL opener (small button) — opens the mini modal -->
        <div class="quick-open-row" style="width:100%; max-width:780px; display:flex; justify-content:center; gap:8px;">
          <button id="quickPlayBtn" class="quick-open-btn" title="Open URL input">Open URL</button>
          <!-- If you want a visible inline quick input instead, we can show one here — for now the button opens the mini modal -->
        </div>

      </main>

    </div>

    <!-- Bottom queue -->
    <div class="bottom-section">
      <div class="queue-section">
        <div class="queue-header">
          <h3>Up Next</h3>
          <div class="queue-info"><span id="queueCount">0 songs</span></div>
        </div>
        <div class="queue-list" id="queueList">
          <div class="queue-item empty"><span>No songs in queue</span></div>
        </div>
      </div>
    </div>

    <!-- Close -->
    <button class="close-btn" id="closeBtn">✕</button>
  </div>

  <!-- MINI MODAL (Spotify-style small popup) -->
  <div id="miniModal" class="mini-modal" aria-hidden="true">
    <div class="mini-modal-card">
      <div class="mini-modal-header">
        <strong>Paste YouTube URL</strong>
        <button id="modalCloseBtn" class="mini-modal-close" aria-label="Close">×</button>
      </div>

      <div class="mini-modal-body">
        <!-- this id is used by the script (urlInput) -->
        <input id="urlInput" class="mini-url-input" placeholder="https://www.youtube.com/watch?v=..." />
        <div class="mini-modal-actions">
          <button id="playBtn" class="action-btn primary">Play</button>
          <button id="addToQueueBtn" class="action-btn secondary">Add</button>
        </div>
        <div style="height:8px;"></div>
        <!-- Volume control (you wanted this) -->
        <label for="volumeSlider">Volume: <span id="volumeValue">50</span>%</label>
        <input id="volumeSlider" type="range" min="0" max="100" value="50" />
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
